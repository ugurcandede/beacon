name: Release beacon

# Push a tag v1.4.0 to release beacon itself: the versions must agree
# (check-version), the CI pipeline's tests and checks pass (no deploy: not main), a
# GitHub release takes the CHANGELOG section as notes, and the major tag (v1) moves
# here, so apps on `@v1` get the actions' fixes. Apps install the packages from the
# tag (pip: git+...@vX.Y.Z#subdirectory=python; SwiftPM: the tag is the version).
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      notes: ${{ steps.check.outputs.notes }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: |
          notes=$(PYTHONPATH=python python3 -m beacon.release check-version "$GITHUB_REF_NAME")
          { echo "notes<<EOF"; echo "$notes"; echo "EOF"; } >> "$GITHUB_OUTPUT"

  ci:
    needs: check
    uses: ./.github/workflows/ci.yml   # no secrets: a tag run never deploys

  github:
    needs: [check, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ needs.check.outputs.notes }}
        run: |
          # A re-run finds the release there: nothing is made twice.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --title "beacon $GITHUB_REF_NAME" --notes "$NOTES"
          # The major tag (v1) follows the highest release of that major only: a
          # patch on an older line (v1.0.1 after v1.2.0) must not move it back.
          major="${GITHUB_REF_NAME%%.*}"
          git fetch -q --tags
          highest=$(git tag --list "$major.*" | sort -V | tail -1)
          if [ "$highest" = "$GITHUB_REF_NAME" ]; then
            git tag -f "$major" "$GITHUB_REF_NAME"
            git push -f origin "refs/tags/$major"
          else
            echo "$major stays at $highest"
          fi
