name: beacon next version
description: >
  The next release version: the highest vX.Y.Z tag bumped by the commit subjects
  in this push (BREAKING:/bump: major, feat: minor, anything else patch).
  Needs actions/checkout with fetch-depth 0.

inputs:
  since:
    description: The commit before this push; every commit after it counts.
    default: ${{ github.event.before }}

outputs:
  tag:
    description: e.g. v1.5.0
    value: ${{ steps.next.outputs.tag }}
  version:
    description: e.g. 1.5.0
    value: ${{ steps.next.outputs.version }}

runs:
  using: composite
  steps:
    - id: next
      shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}/../../../python
        SINCE: ${{ inputs.since }}
      run: |
        if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
          echo "::error::checkout with fetch-depth: 0, or the tags are missing and the version starts over"; exit 1
        fi
        # Windows runners have python, not always python3.
        PY=python3; [ "$RUNNER_OS" = Windows ] && PY=python
        $PY -m beacon.release next-version --since "$SINCE" | tee -a "$GITHUB_OUTPUT"
